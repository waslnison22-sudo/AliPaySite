name: Deploy AliPay to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          package-manager-cache: false
      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
          npm_config_fetch_timeout: 300000
        run: |
          for attempt in 1 2 3; do
            npm install --no-audit --no-fund --engine-strict && break
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after 3 attempts" >&2
              exit 1
            fi
            echo "npm install attempt $attempt failed; retrying in 10 seconds..."
            sleep 10
          done
          test -d node_modules/vite
          test -d node_modules/react
          test -d node_modules/@vitejs/plugin-react
      - name: Build
        run: npm run build
      - name: Create Pages fallback
        run: cp dist/index.html dist/404.html
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/brand/fox-user.png
          test -f dist/brand/alipay-logo.jpg
          test -d dist/assets
          test -d dist/photos
          grep -q 'brand/fox-user.png' dist/index.html
          ! grep -q 'fox.svg' dist/index.html
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
